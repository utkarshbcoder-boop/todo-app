services:
  - type: web
    name: todo-app
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://todo-app.vercel.app
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PANEL_PASSWORD_HASH
        sync: false
